# GitHub Actions Workflow · site-report-v2
# Fleet template: 純靜態 HTML → GitHub Pages
# 1 個 HTML 入口（dashboard.html），無需 npm build
# 未來 Vercel 部署（Next.js + face-api.js + Supabase）需另外配置

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # site-report-v2 目前為純靜態 HTML（dashboard.html）
  # 完整 Next.js 後端版本將部署到 Vercel（待實作）
  # Pages 部署 demo dashboard.html + 規格書

  link-check:
    name: Link Check (static HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML files exist
        run: |
          echo "--- HTML 入口檢查 ---"
          for f in dashboard.html; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
      - name: Check internal links
        run: |
          echo "--- 內部連結檢查 ---"
          broken=0
          for f in *.html; do
            for link in $(grep -oE 'href="[^"]*\.html"' "$f" 2>/dev/null | tr -d '"' | sed 's/href=//'); do
              if [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              fi
            done
          done
          if [ $broken -gt 0 ]; then
            echo "Found $broken broken links"
            exit 1
          fi
          echo "✅ All internal links valid"

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: [link-check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # 上傳整個 repo 根目錄（dashboard.html + SPEC.md + PRD/）

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
